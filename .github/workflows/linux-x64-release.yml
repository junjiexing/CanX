name: Linux package

on:
  workflow_call:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        type: string
      commit:
        description: Source commit resolved by the caller
        required: true
        type: string
      architecture:
        description: Native runner architecture (x64 or arm64)
        required: false
        default: x64
        type: string
      snapshot:
        description: Ubuntu snapshot timestamp; empty uses current Ubuntu 22.04 repositories
        required: false
        default: '20250901T000000Z'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      CANX_LINUX_ARCHITECTURE: ${{ inputs.architecture }}
      RID: linux-${{ inputs.architecture }}
      CANX_UBUNTU_SNAPSHOT: ${{ inputs.snapshot }}
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - name: Free hosted runner space for native compilation
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h .

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/nuget
          key: linux-${{ inputs.architecture }}-nuget-v1-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}

      - name: Download prebuilt native dependencies
        run: scripts/fetch-native-deps.sh linux

      - name: Build, audit and package in Ubuntu 22.04
        shell: bash
        env:
          CANX_CI_VERSION: ${{ inputs.version }}
        run: |
          [[ "$CANX_CI_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]
          scripts/run-ubuntu-22.04-linux-x64.sh bash -lc '
            set -euo pipefail
            scripts/publish-static-app-linux-x64.sh --skip-build
            scripts/package-release-linux-x64.sh --version "$1"
          ' bash "$CANX_CI_VERSION"

      - name: Verify release contents and checksums
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/verify-release-package-linux-x64.sh --version "$VERSION"
          mv "artifacts/release/$RID/SHA256SUMS" "artifacts/release/$RID/CanX-$VERSION-$RID-SHA256SUMS"

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ inputs.architecture }}
          path: artifacts/release/linux-${{ inputs.architecture }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
